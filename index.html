    function renderCatalog(route){let favoriteMode=route==='yeu-thich';let searchMode=route==='tim-kiem';activeCategory=categories.some(c=>c.id===route)?route:null;let category=categories.find(c=>c.id===route);let title=favoriteMode?'Quán ăn yêu thích':searchMode?'Kết quả tìm kiếm':category?.name||'Khám phá quán ngon';document.title=`${title} | Food đi`;app.innerHTML=`<section class="page-banner"><div class="shell"><div class="breadcrumb"><a href="#trang-chu">Trang chủ</a>　/　${title}</div><div class="eyebrow">${favoriteMode?'Để dành lần tới':searchMode?'Tìm món, tìm quán':'Ăn ngon theo phong vị'}</div><h1>${title}</h1><p>${category?.description|| (favoriteMode?'Những địa chỉ bạn đã lưu để dễ dàng tìm lại.':searchMode?'Gõ tên món ăn hoặc quán để tìm gợi ý phù hợp.':'Chọn quận, mức giá và không gian hợp với buổi hẹn của bạn.')}</p></div></section><section class="catalog-section"><div class="shell"><div class="catalog-toolbar"><button class="mobile-filter-toggle" id="filterToggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M7 12h10m-7 6h4"/></svg>Bộ lọc</button><label class="catalog-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="catalogSearch" value="${escapeAttr(searchMode?searchTerm:'')}" placeholder="Tên quán hoặc món ăn..." aria-label="Tìm tên quán hoặc món ăn"></label><label class="sort-control">Sắp xếp <select id="sortSelect"><option value="featured">Gợi ý</option><option value="score">Điểm cao nhất</option><option value="price-low">Giá thấp đến cao</option><option value="price-high">Giá cao đến thấp</option></select></label></div><div class="catalog-layout"><aside class="filters" id="filters"><div class="filter-group"><h3>Khu vực</h3><select id="districtFilter">${districts.map(d=>`<option>${d}</option>`).join('')}</select></div><div class="filter-group"><h3>Ngân sách / người</h3><div class="filter-options">${priceRanges.map((p,i)=>`<label class="filter-option"><input type="radio" name="price" value="${i}" ${i===0?'checked':''}>${p.label}</label>`).join('')}</div></div><div class="filter-group"><h3>Không gian</h3><div class="filter-options">${['Tất cả','Trong nhà','Ngoài trời','Mộc mạc','Sang trọng'].map((s,i)=>`<label class="filter-option"><input type="radio" name="space" value="${i===0?'':s}" ${i===0?'checked':''}>${s}</label>`).join('')}</div></div><div class="filter-group"><h3>Chỗ đậu xe</h3><div class="filter-options">${['Tất cả','Xe máy','Ô tô'].map((s,i)=>`<label class="filter-option"><input type="radio" name="parking" value="${i===0?'':s}" ${i===0?'checked':''}>${s}</label>`).join('')}</div></div><button class="filter-clear" id="clearFilters">Xóa bộ lọc</button></aside><div><div class="results-heading"><strong id="resultCount"></strong><span>Gợi ý địa điểm tại TP.HCM</span></div><div class="restaurant-grid catalog-grid" id="catalogGrid"></div></div></div></div></section>${footer()}`;wireCommon();const controls=['catalogSearch','districtFilter','sortSelect'];controls.forEach(id=>document.getElementById(id).addEventListener(id==='catalogSearch'?'input':'change',renderResults));document.querySelectorAll('.filters input').forEach(el=>el.addEventListener('change',renderResults));document.getElementById('clearFilters').addEventListener('click',()=>{document.getElementById('catalogSearch').value='';document.getElementById('districtFilter').selectedIndex=0;document.querySelector('input[name="price"][value="0"]').checked=true;['space','parking'].forEach(n=>document.querySelector(`input[name="${n}"][value=""]`).checked=true);renderResults()});document.getElementById('filterToggle').addEventListener('click',()=>document.getElementById('filters').classList.toggle('open'));renderResults()}
    function renderResults(){let favoriteMode=location.hash==='#/yeu-thich';let category=activeCategory;let q=document.getElementById('catalogSearch').value.trim().toLocaleLowerCase('vi');let district=document.getElementById('districtFilter').value;let price=priceRanges[Number(document.querySelector('input[name="price"]:checked').value)];let space=document.querySelector('input[name="space"]:checked').value;let parking=document.querySelector('input[name="parking"]:checked').value;let list=restaurants.filter(r=>(!category||r.category===category)&&(!favoriteMode||saved.has(r.id))&&(!q||`${r.name} ${r.dish} ${categoryName(r.category)} ${r.district}`.toLocaleLowerCase('vi').includes(q))&&(district==='Tất cả quận'||r.district===district)&&r.price>=price.min&&r.price<=price.max&&(!space||r.space===space)&&(!parking||r.parking===parking));let sort=document.getElementById('sortSelect').value;if(sort==='score')list.sort((a,b)=>b.score-a.score);if(sort==='price-low')list.sort((a,b)=>a.price-b.price);if(sort==='price-high')list.sort((a,b)=>b.price-a.price);document.getElementById('resultCount').textContent=`${list.length} địa chỉ ${list.length===1?'phù hợp':'đang chờ bạn'}`;document.getElementById('catalogGrid').innerHTML=list.length?list.map(card).join(''):`<div class="empty-state"><strong>${favoriteMode?'Chưa có quán nào trong danh sách yêu thích':'Chưa tìm thấy quán phù hợp'}</strong>${favoriteMode?'Nhấn trái tim ở quán bạn thích để lưu lại nhé.':'Thử đổi từ khóa hoặc nới bộ lọc một chút nha.'}</div>`;wireCards()}
    function escapeAttr(s){return String(s||'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}
    function wireCommon(){document.querySelectorAll('[data-route-go]').forEach(b=>b.addEventListener('click',()=>location.hash=`#/${b.dataset.routeGo}`));document.querySelectorAll('a[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===activeCategory));wireCards()}
    function wireCards(){document.querySelectorAll('[data-heart]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();let id=Number(b.dataset.heart);saved.has(id)?saved.delete(id):saved.add(id);updateSaved();showToast(saved.has(id)?'Đã lưu vào quán yêu thích':'Đã bỏ khỏi quán yêu thích');if(location.hash==='#/yeu-thich')renderCatalog('yeu-thich');else{b.classList.toggle('is-saved',saved.has(id));b.setAttribute('aria-label',saved.has(id)?'Bỏ yêu thích':'Lưu yêu thích')}}));document.querySelectorAll('[data-detail]').forEach(el=>el.addEventListener('click',()=>openDetail(Number(el.dataset.detail))))}
    function openDetail(id){currentRestaurant=restaurants.find(r=>r.id===id);if(!currentRestaurant)return;selectedRating=5;const r=currentRestaurant;document.getElementById('detailPanel').innerHTML=`<button class="detail-close" id="detailClose" aria-label="Đóng">×</button><div class="detail-hero"><img src="${r.image}" onerror="this.src='${imgFallback}'" alt="${r.dish}"><div class="detail-hero-title"><h2>${r.name}</h2><div>★ ${r.score.toFixed(1)} <span style="opacity:.8">· ${r.reviews} lượt đánh giá · ${r.district}</span></div></div></div><div class="detail-content"><div><div class="eyebrow">${categoryName(r.category)}</div><p class="detail-description">${r.description}</p><div class="detail-facts"><div class="fact"><b>Địa chỉ</b>${r.address}</div><div class="fact"><b>Món nổi bật</b>${r.dish}</div><div class="fact"><b>Khoảng giá</b>${formatPrice(r.price)} / người</div><div class="fact"><b>Không gian · Đỗ xe</b>${r.space} · ${r.parking}</div></div><h3>Người đi ăn nói gì?</h3><div class="review-list">${r.comments.map(c=>`<div class="review-item"><strong>${c[0]}　<span class="review-stars">★★★★★</span></strong><p>${c[1]}</p></div>`).join('')}</div></div><form class="review-form" id="reviewForm"><h3>Để lại một chiếc review</h3><label>Chấm điểm của bạn</label><div class="star-picker" id="starPicker">${[1,2,3,4,5].map(n=>`<button type="button" data-rating="${n}" class="${n<=5?'selected':''}" aria-label="${n} sao">★</button>`).join('')}</div><label for="reviewName">Tên của bạn</label><input id="reviewName" required placeholder="Tên hiển thị"><label for="reviewText">Cảm nhận sau khi ghé</label><textarea id="reviewText" required placeholder="Món ngon ra sao, không gian thế nào..."></textarea><button class="primary-button">Gửi đánh giá</button></form></div>`;document.getElementById('detailBackdrop').classList.add('open');document.body.style.overflow='hidden';document.getElementById('detailClose').addEventListener('click',closeDetail);document.querySelectorAll('[data-rating]').forEach(b=>b.addEventListener('click',()=>{selectedRating=Number(b.dataset.rating);document.querySelectorAll('[data-rating]').forEach(star=>star.classList.toggle('selected',Number(star.dataset.rating)<=selectedRating))}));document.getElementById('reviewForm').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('reviewName').value.trim();const text=document.getElementById('reviewText').value.trim();r.comments.unshift([name,text]);r.reviews++;r.score=Number(((r.score*(r.reviews-1)+selectedRating)/r.reviews).toFixed(1));closeDetail();showToast('Cảm ơn bạn đã chia sẻ trải nghiệm!');if(location.hash.startsWith('#/'))renderCatalog(location.hash.slice(2));else renderHome()})}
    function closeDetail(){document.getElementById('detailBackdrop').classList.remove('open');document.body.style.overflow=''}function showToast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
    document.getElementById('detailBackdrop').addEventListener('click',e=>{if(e.target.id==='detailBackdrop')closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});document.getElementById('favoritesNav').addEventListener('click',()=>location.hash='#/yeu-thich');document.getElementById('menuButton').addEventListener('click',()=>nav.classList.toggle('open'));window.addEventListener('hashchange',()=>{nav.classList.remove('open');const route=decodeURIComponent(location.hash.slice(1));if(!route||route==='/trang-chu'){renderHome();return}const key=route.replace(/^\//,'');if(key==='yeu-thich'||key==='tim-kiem'||categories.some(c=>c.id===key)){renderCatalog(key);return}renderHome()});updateSaved();if(!location.hash||location.hash==='#trang-chu')renderHome();else{const key=decodeURIComponent(location.hash.slice(2));renderCatalog(key)}
  </script>
</body>
